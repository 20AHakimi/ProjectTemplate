<html lang=" = "en-gb">
    <body>
        <p id="time">Loading...</p>

        <script>
            function getTime() {
                fetch("http://localhost:8080/time").then(response => response.text()).then(time => {
                    document.getElementById("time").textContent = time;
                }).catch(error => {
                    document.getElementById("time").textContent = "Error contacting server";
                });
            }

            setInterval(getTime, 1000);
            getTime();
        </script>
    </body>
</html>
